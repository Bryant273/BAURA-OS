<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BAURA OS – Démarrage</title>
<link rel="icon" href="icones/favicon.svg" type="image/svg+xml">
<style>
  :root{--ease-out:cubic-bezier(.16,1,.3,1);--ease-spring:cubic-bezier(.3,1.45,.45,1)}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#000;overflow:hidden}
  body{font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}

  /* ---------- Écran de démarrage : noir + symbole blanc ---------- */
  .boot{position:fixed;inset:0;z-index:10;background:#000;display:grid;place-items:center;overflow:hidden;transition:opacity .9s ease .05s}
  .boot.done{opacity:0;pointer-events:none}
  .boot::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.05),transparent 45%);opacity:0}
  .run::before{animation:fadeIn 2s ease .3s forwards}

  .stage{position:relative;display:grid;place-items:center}
  .logoWrap{transition:transform 1s var(--ease-out)}
  .p1 .logoWrap{transform:translateY(-4.5vh)}      /* phase 1 : logo un peu plus haut, le nom est dessous */
  .logo{display:block;height:clamp(120px,22vh,190px);width:auto;overflow:visible}
  .logo *{fill:#fff;opacity:0;transform-box:fill-box}
  .b1{transform-origin:center bottom} .b2,.b3{transform-origin:left center} .b4{transform-origin:center}
  .run .b1{animation:barIn .85s var(--ease-spring) .3s forwards}
  .run .b2{animation:discIn .8s var(--ease-spring) .62s forwards}
  .run .b3{animation:discIn .8s var(--ease-spring) .78s forwards}
  .run .b4{animation:dotIn .75s var(--ease-spring) 1.1s forwards}
  .p2 .b4{animation:dotPulse 1.8s ease-in-out infinite!important}
  @keyframes barIn{from{opacity:0;transform:translateY(42px) scaleY(.15)}to{opacity:1;transform:none}}
  @keyframes discIn{from{opacity:0;transform:translateX(-30px) scale(.35,.7)}to{opacity:1;transform:none}}
  @keyframes dotIn{0%{opacity:0;transform:scale(0)}60%{opacity:1;transform:scale(1.6)}100%{opacity:1;transform:scale(1)}}
  @keyframes dotPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.8)}}
  @keyframes fadeIn{to{opacity:1}}

  /* Nom (phase 1 seulement) */
  .word{position:absolute;left:50%;top:calc(100% + 4.5vh + clamp(18px,3.4vh,32px));transform:translate(-50%,8px);color:#fff;white-space:nowrap;
    font-size:clamp(18px,2.7vh,25px);font-weight:700;letter-spacing:.42em;padding-left:.42em;opacity:0}
  .run .word{animation:wordIn .9s var(--ease-out) 1.45s forwards}
  .p2 .word{animation:wordOut .6s ease forwards!important}
  @keyframes wordIn{to{opacity:1;transform:translate(-50%,0)}}
  @keyframes wordOut{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-6px)}}

  /* Barre de progression (phase 2 seulement) */
  .prog{position:absolute;left:50%;top:calc(50% + clamp(60px,11vh,95px) + clamp(36px,6vh,54px));transform:translateX(-50%);
    width:min(190px,52vw);height:3px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden;opacity:0;transition:opacity .6s ease}
  .p2 .prog{opacity:1}
  .fill{height:100%;width:0;border-radius:3px;background:#fff}

  .fin .stage{transform:scale(1.05);transition:transform .9s var(--ease-out)}

  .hint{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:20;font-size:12px;color:rgba(255,255,255,.35);opacity:0;transition:opacity .4s;pointer-events:none}
  .hint.show{opacity:1}
  .phase{position:fixed;right:16px;top:16px;z-index:20;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.28);opacity:0;transition:opacity .4s}
  .phase.show{opacity:1}

  @media (prefers-reduced-motion:reduce){.logoWrap{transition:none}}
</style>
</head>
<body>

<div class="boot run p1" id="boot" aria-label="Démarrage de BAURA OS">
  <div class="stage">
    <div class="logoWrap">
      <svg class="logo" viewBox="150 29 199 420" aria-hidden="true">
        <rect class="b1" x="150" y="29" width="48" height="420" rx="24"/>
        <path class="b2" d="M248 29A101 102.5 0 0 1 248 234Z"/>
        <path class="b3" d="M248 245A101 102 0 0 1 248 449Z"/>
        <rect class="b4" x="316" y="221" width="33" height="36" rx="15"/>
      </svg>
    </div>
    <div class="word">BAURA</div>
  </div>
  <div class="prog"><div class="fill" id="fill"></div></div>
</div>

<div class="hint" id="hint">Clique ou appuie sur Échap pour passer</div>
<div class="phase" id="phase"></div>

<script src="baura-system.js"></script>
<script>
(function(){
  const boot=document.getElementById('boot'), fill=document.getElementById('fill'),
        hint=document.getElementById('hint'), phase=document.getElementById('phase');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches, SCALE=reduce?.4:1;
  const PHASE2_AT=3.2;                                                 // secondes : le nom disparaît, la barre apparaît
  const CURVE=[[3.2,0],[3.7,.04],[4.5,.30],[4.9,.33],[5.7,.66],[6.0,.68],[6.9,.95],[7.3,1]];
  let raf=0,t0=0,skipAt=null,finished=false,inP2=false;

  function prog(t){
    if(t<=CURVE[0][0]) return 0;
    for(let i=1;i<CURVE.length;i++){const[a,pa]=CURVE[i-1],[b,pb]=CURVE[i];
      if(t<=b){const k=(t-a)/(b-a);return pa+(pb-pa)*(k*k*(3-2*k)*.4+k*.6)}}
    return 1;
  }
  function setPhase(n){
    boot.classList.toggle('p1',n===1); boot.classList.toggle('p2',n===2);
    phase.textContent=n===1?'Démarrage · 1/2':'Démarrage · 2/2';
  }
  function frame(now){
    if(!t0) t0=now;
    let t=(now-t0)/1000/SCALE;
    if(skipAt!==null) t=skipAt+(t-skipAt)*4;
    if(!inP2&&t>=PHASE2_AT){inP2=true;setPhase(2)}
    const v=Math.min(1,prog(t)); fill.style.width=(v*100)+'%';
    if(v>=1){finish();return}
    raf=requestAnimationFrame(frame);
  }
  function finish(){
    if(finished) return; finished=true; hint.classList.remove('show'); phase.classList.remove('show');
    setTimeout(()=>{
      boot.classList.add('fin');
      if(window.Baura&&Baura.framed){ Baura.send('boot-done') }          // le système (index.html) fait le fondu vers la connexion
      else { boot.classList.add('done'); setTimeout(()=>{ window.Baura?Baura.send('boot-done'):location.href='login-baura.html' },1000) }
    },500*SCALE);
  }
  function skip(){ if(finished||skipAt!==null) return; skipAt=(performance.now()-t0)/1000/SCALE }
  function start(){
    cancelAnimationFrame(raf);
    finished=false;inP2=false;skipAt=null;t0=0; fill.style.width='0%';
    boot.classList.remove('done','fin','run','p2'); void boot.offsetWidth; boot.classList.add('run'); setPhase(1);
    setTimeout(()=>{hint.classList.add('show');phase.classList.add('show')},900);
    raf=requestAnimationFrame(frame);
  }
  boot.addEventListener('pointerdown',skip);
  addEventListener('keydown',e=>{ if(e.key==='Escape') skip() });
  start();
})();
</script>
</body>
</html>
