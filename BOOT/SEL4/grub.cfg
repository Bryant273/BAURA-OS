set timeout=0
set default=0

# Configure video mode and framebuffer payload for Multiboot2
insmod all_video
insmod vbe
insmod vga
insmod video_bochs
insmod video_cirrus
insmod gfxterm

set gfxmode=1024x768x32,1024x768,auto
set gfxpayload=1024x768x32,1024x768,auto

menuentry "BAURA OS - seL4 x86_64 initial task" {
    multiboot2 /boot/kernel.elf
    module2 /boot/baura_init.elf baura-init
    boot
}
